services:
  # === Ollama for Text Generation ===
  ollama-generation:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    environment:
      # デフォルトモデルを言語生成用に設定
      OLLAMA_GENERATION_MODEL: qwen3:8b
    volumes:
      - ollama_generation_models:/root/.ollama
    gpus: all
    restart: unless-stopped

  # === Ollama for Embedding ===
  ollama-embedding:
    image: ollama/ollama:latest
    ports:
      - "11435:11434" # ホストポートをずらす
    environment:
      # デフォルトモデルをエンべディング用に設定
      OLLAMA_EMBEDDING_MODEL: embeddinggemma:300m
    volumes:
      - ollama_embedding_models:/root/.ollama
    gpus: all
    restart: unless-stopped

  # === Celery Worker for Text Generation ===
  celery-generation:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    command: bash -lc "celery -A backend.worker.celery_app.celery_app worker --loglevel=info --pool=threads --concurrency=1 -Q generation"
    environment:
      REDIS_PORT: 6379
      # 生成用Ollamaに接続
      OLLAMA_URL: http://ollama-generation:11434
      OLLAMA_GENERATION_MODEL: qwen3:8b
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    depends_on:
      - ollama-generation
    restart: unless-stopped

  # === Celery Worker for Embedding ===
  celery-embedding:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    command: bash -lc "celery -A backend.worker.celery_app.celery_app worker --loglevel=info --pool=threads --concurrency=1 -Q embedding"
    environment:
      REDIS_PORT: 6379
      # エンべディング用Ollamaに接続
      OLLAMA_URL: http://ollama-embedding:11434
      OLLAMA_EMBEDDING_MODEL: embeddinggemma:300m
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    depends_on:
      - ollama-embedding
    restart: unless-stopped

volumes:
  ollama_generation_models:
  ollama_embedding_models:
